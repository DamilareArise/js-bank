<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="alertScreen"></p>

    <p>Register</p>
    <input type="text" placeholder="Fullname" id="user_name">
    <input type="email" placeholder="Email" id="user_email">
    <input type="password" placeholder="Password" id="user_pass">
    <button id="registerUser">Register</button>

    <p>Login</p>
    <input type="email" placeholder="Email" id="login_email">
    <input type="password" placeholder="Password" id="login_pass">
    <button id="loginUser">Log in</button> <button id="logoutUser">Log out</button>

    <script type="module">
        // import {Bank, Transaction} from "./config.js"
        import Bank from "./config.js"

        let myBank = new Bank()
        // console.log(myBank);
        
        registerUser.addEventListener("click", ()=>{
            let res = myBank.create_account(user_name.value, user_email.value, user_pass.value)
            alertScreen.innerHTML = res
            
        })


        loginUser.addEventListener("click", ()=>{
            let res = myBank.login(login_email.value, login_pass.value)
            console.log(res);
    
            alertScreen.innerHTML = res['message']
            if(res['status']){
                window.location.href = "./dashboard.html"
            }
        })
        
    </script>
</body>
</html>
